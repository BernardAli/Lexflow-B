services:
  lexflow:
    build: .
    container_name: lexflow-ai-demo
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      LEXFLOW_DATA_DIR: /data
      LEXFLOW_SEED_DEMO: ${LEXFLOW_SEED_DEMO:-1}
      LEXFLOW_MAX_UPLOAD_MB: ${LEXFLOW_MAX_UPLOAD_MB:-12}
      LEXFLOW_SECURE_COOKIES: ${LEXFLOW_SECURE_COOKIES:-0}
      LEXFLOW_ALLOW_EXTERNAL_AI: ${LEXFLOW_ALLOW_EXTERNAL_AI:-0}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      LEXFLOW_ALLOWED_HOSTS: ${LEXFLOW_ALLOWED_HOSTS:-localhost,127.0.0.1}
      LEXFLOW_RESET_DELIVERY: ${LEXFLOW_RESET_DELIVERY:-demo}
      LEXFLOW_PUBLIC_URL: ${LEXFLOW_PUBLIC_URL:-}
      LEXFLOW_STORAGE_KEYS: ${LEXFLOW_STORAGE_KEYS:-}
      LEXFLOW_AUDIT_KEY: ${LEXFLOW_AUDIT_KEY:-}
      LEXFLOW_WEBHOOK_TARGETS: ${LEXFLOW_WEBHOOK_TARGETS:-}
      LEXFLOW_SMTP_HOST: ${LEXFLOW_SMTP_HOST:-}
      LEXFLOW_SMTP_PORT: ${LEXFLOW_SMTP_PORT:-587}
      LEXFLOW_SMTP_SECURITY: ${LEXFLOW_SMTP_SECURITY:-starttls}
      LEXFLOW_SMTP_FROM: ${LEXFLOW_SMTP_FROM:-}
      LEXFLOW_SMTP_USERNAME: ${LEXFLOW_SMTP_USERNAME:-}
      LEXFLOW_SMTP_PASSWORD: ${LEXFLOW_SMTP_PASSWORD:-}
    volumes:
      - lexflow_data:/data
    restart: unless-stopped
volumes:
  lexflow_data:
