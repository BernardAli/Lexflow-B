services:
  lexflow:
    build:
      context: ..
    environment:
      LEXFLOW_SECURITY_PROFILE: hardened
      LEXFLOW_SEED_DEMO: "0"
      LEXFLOW_SECURE_COOKIES: "1"
      LEXFLOW_RESET_DELIVERY: ${LEXFLOW_RESET_DELIVERY:-disabled}
      LEXFLOW_PUBLIC_URL: https://${LEXFLOW_DOMAIN:?Set LEXFLOW_DOMAIN}
      LEXFLOW_ALLOWED_HOSTS: ${LEXFLOW_DOMAIN},127.0.0.1
      LEXFLOW_DATA_DIR: /data
      LEXFLOW_AUDIT_KEY: ${LEXFLOW_AUDIT_KEY:?Set a 32+ character audit key}
      LEXFLOW_STORAGE_KEYS: ${LEXFLOW_STORAGE_KEYS:?Set workspace encryption key rings}
      LEXFLOW_WEBHOOK_TARGETS: ${LEXFLOW_WEBHOOK_TARGETS:-}
      LEXFLOW_SMTP_HOST: ${LEXFLOW_SMTP_HOST:-}
      LEXFLOW_SMTP_FROM: ${LEXFLOW_SMTP_FROM:-}
      LEXFLOW_SMTP_PORT: ${LEXFLOW_SMTP_PORT:-587}
      LEXFLOW_SMTP_SECURITY: ${LEXFLOW_SMTP_SECURITY:-starttls}
      LEXFLOW_SMTP_USERNAME: ${LEXFLOW_SMTP_USERNAME:-}
      LEXFLOW_SMTP_PASSWORD: ${LEXFLOW_SMTP_PASSWORD:-}
    command: [python, -m, uvicorn, lexflow.main:app, --host, 0.0.0.0, --port, "8000", --proxy-headers, --forwarded-allow-ips, "172.30.5.2"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:size=256m,mode=1777]
    pids_limit: 128
    mem_limit: 1g
    volumes:
      - workspace_data:/data
    networks:
      workspace:
        ipv4_address: 172.30.5.3
    restart: unless-stopped
  proxy:
    image: caddy:2.11.7-alpine
    ports: ["80:80", "443:443"]
    environment:
      LEXFLOW_DOMAIN: ${LEXFLOW_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - proxy_data:/data
      - proxy_config:/config
    networks:
      workspace:
        ipv4_address: 172.30.5.2
    depends_on:
      lexflow:
        condition: service_healthy
    restart: unless-stopped
networks:
  workspace:
    ipam:
      config:
        - subnet: 172.30.5.0/24
volumes:
  workspace_data:
  proxy_data:
  proxy_config:
